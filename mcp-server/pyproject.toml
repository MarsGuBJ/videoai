[project]
name = "videoai-mcp-server"
version = "0.1.0"
requires-python = ">=3.10"
# 服务非打包分发，运行时依赖仍走 requirements.txt / requirements-dev.txt，
# 此处只放元信息与工具配置。

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "BLE", "S", "G", "T20", "RET", "SIM", "C4", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "N802"]  # 测试断言、模拟口令与 SDK 风格 mock 命名
"app/models.py" = ["N815"]  # 契约豁免：pydantic 模型 camelCase 字段即 HTTP/MCP 出入参 key
"app/hcnetsdk_playback.py" = ["N801"]  # ctypes 结构体命名对齐海康 HCNetSDK C API
"app/camera_import.py" = ["T201"]  # CLI 脚本：stdout 用户输出保留 print
"app/tools/*.py" = ["N803"]  # 契约豁免：MCP 工具参数名（camelCase）即对外协议字段
"app/server.py" = ["N803"]  # 契约豁免：MCP 资源 URI 模板变量名

[tool.mypy]
python_version = "3.10"
strict = true
# 渐进收敛：新文件必须 strict；以下为存量模块豁免清单，
# 后续阶段逐个消除，直至可删除全部 overrides。
[[tool.mypy.overrides]]
module = [
    "app.camera_import",
    "app.context",
    "app.hcnetsdk_playback",
    "app.hikvision_nvr",
    "app.media_proxy",
    "app.minio_storage",
    "app.models",
    "app.person_api_client",
    "app.recording_cache",
    "app.routes",
    "app.server",
    "app.settings",
    "app.tools",
    "app.tools.*",
    "app.videoai_client",
    "app.xml_builder",
    "tests.*",
]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# 手册目标 ≥80%，渐进提升，禁止下调。
# 基线为阶段 4 实测值（2026-08-24，pytest --cov 总量 63.86% 向下取整）。
fail_under = 63
