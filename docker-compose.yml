services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videoai}
      POSTGRES_USER: ${POSTGRES_USER:-videoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videoai}
    ports:
      - "192.168.11.194:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videoai} -d ${POSTGRES_DB:-videoai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  zlm:
    image: registry.cn-hangzhou.aliyuncs.com/ossrs/srs:5
    ports:
      - "192.168.11.194:8080:8080"
      - "192.168.11.194:1935:1935"
    environment:
      ZLM_SECRET: ${ZLM_SECRET:-035c73f7-bb6b-4889-a715-d9eb2d1925cc}
    restart: unless-stopped

  triton:
    profiles:
      - inference
    image: nvcr.io/nvidia/tritonserver:24.10-py3
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --strict-model-config=false
      - --http-port=8000
      - --grpc-port=8001
      - --metrics-port=8002
    ports:
      - "192.168.11.194:8000:8000"
      - "192.168.11.194:8001:8001"
      - "192.168.11.194:8002:8002"
    volumes:
      - ./infra/model_repository:/models
    restart: unless-stopped

  backend:
    build:
      context: ./backend-lite
      network: host
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-videoai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-videoai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-videoai}
      VIDEOAI_ZLM_HTTP_URL: ${ZLM_HTTP_URL:-http://zlm}
      VIDEOAI_ZLM_PUBLIC_HTTP_URL: ${ZLM_PUBLIC_HTTP_URL:-http://localhost:8080}
      VIDEOAI_ZLM_SECRET: ${ZLM_SECRET:-035c73f7-bb6b-4889-a715-d9eb2d1925cc}
      VIDEOAI_ZLM_RTMP_PUSH_BASE: ${ZLM_RTMP_PUSH_BASE:-rtmp://localhost/live}
      VIDEOAI_PREVIEW_IDLE_SECONDS: ${VIDEOAI_PREVIEW_IDLE_SECONDS:-10}
      VIDEOAI_PREVIEW_START_TIMEOUT_MS: ${VIDEOAI_PREVIEW_START_TIMEOUT_MS:-15000}
      VIDEOAI_PREVIEW_FFMPEG_CMD_KEY: ${VIDEOAI_PREVIEW_FFMPEG_CMD_KEY:-ffmpeg.cmd_preview_h264}
      VIDEOAI_ZLM_PREVIEW_RTMP_BASE: ${ZLM_PREVIEW_RTMP_BASE:-rtmp://127.0.0.1/live}
      VIDEOAI_WORKER_URL: ${WORKER_URL:-http://worker:8090}
      VIDEOAI_DINO_CAMERA_HOSTS: ${VIDEOAI_DINO_CAMERA_HOSTS:-192.168.11.65}
      PERSON_API_BASE_URL: ${PERSON_API_BASE_URL:-http://192.168.11.192:18890}
      # 文搜视频的分析服务地址（MinIO 视频智能分析 API），现场按实际部署覆盖
      VIDEO_ANALYSIS_API_BASE_URL: ${VIDEO_ANALYSIS_API_BASE_URL:-http://192.168.11.192:8775}
      VIDEOAI_BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8081}
      VIDEOAI_MEDIA_BACKEND_URL: http://backend-media:8081
      # backend-lite 调 mcp-server 的地址：默认走 compose 内网服务名，避免写死现场 IP
      MCP_SERVER_BASE_URL: ${MCP_SERVER_BASE_URL:-http://mcp-server:8097}
      VIDEOAI_TRITON_HTTP_URL: ${TRITON_HTTP_URL:-http://192.168.11.194:8003}
      TRITON_HTTP_URL: ${TRITON_HTTP_URL:-http://192.168.11.194:8003}
      TRITON_MODEL_REPOSITORY: /models
      VIDEOAI_STORAGE_FACE_DIR: /data/faces
      VIDEOAI_STORAGE_CAMERA_DIR: /data/cameras
      VIDEOAI_STORAGE_SNAPSHOT_DIR: /data/snapshots
      VIDEOAI_STORAGE_QUERY_IMAGE_DIR: /data/query-images
      VIDEOAI_STORAGE_ALGORITHM_DIR: /data/algorithms
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      FACE_SCAN_INTERVAL_SECONDS: ${FACE_SCAN_INTERVAL_SECONDS:-30}
      FACE_EVENT_COOLDOWN_SECONDS: ${FACE_EVENT_COOLDOWN_SECONDS:-60}
      HIKVISION_NVR_BASE_URL: ${HIKVISION_NVR_BASE_URL:-}
      HIKVISION_NVR_USERNAME: ${HIKVISION_NVR_USERNAME:-}
      HIKVISION_NVR_PASSWORD: ${HIKVISION_NVR_PASSWORD:-}
      VIDEOAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-videoai}:${POSTGRES_PASSWORD:-videoai}@postgres:5432/${POSTGRES_DB:-videoai}
      FFMPEG_BIN: /app/ffmpeg-wrapper.sh
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,backend,backend-media,worker,triton,zlm,postgres,videoai-backend-1,videoai-backend-media-1,videoai-worker-1,videoai-triton-1,videoai-zlm-1,videoai-postgres-1,host.docker.internal
      no_proxy: localhost,127.0.0.1,backend,backend-media,worker,triton,zlm,postgres,videoai-backend-1,videoai-backend-media-1,videoai-worker-1,videoai-triton-1,videoai-zlm-1,videoai-postgres-1,host.docker.internal
    ports:
      - "192.168.11.194:8081:8081"
    volumes:
      - ./storage/faces:/data/faces
      - ./storage/cameras:/data/cameras
      - ./storage/snapshots:/data/snapshots
      - ./storage/query-images:/data/query-images
      - ./storage/algorithms:/data/algorithms
      - ${TRITON_MODEL_REPOSITORY_HOST:-./infra/model_repository}:/models
      - /:/host:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend-media:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MEDIA_POSTGRES_DB:-videoai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-videoai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-videoai}
      VIDEOAI_ZLM_HTTP_URL: ${ZLM_HTTP_URL:-http://zlm}
      VIDEOAI_ZLM_PUBLIC_HTTP_URL: ${ZLM_PUBLIC_HTTP_URL:-http://localhost:8080}
      VIDEOAI_ZLM_SECRET: ${ZLM_SECRET:-035c73f7-bb6b-4889-a715-d9eb2d1925cc}
      VIDEOAI_ZLM_RTMP_PUSH_BASE: ${ZLM_RTMP_PUSH_BASE:-rtmp://localhost/live}
      VIDEOAI_ZLM_PREVIEW_RTMP_BASE: ${ZLM_PREVIEW_RTMP_BASE:-rtmp://127.0.0.1/live}
      VIDEOAI_PREVIEW_IDLE_SECONDS: ${VIDEOAI_PREVIEW_IDLE_SECONDS:-10}
      VIDEOAI_PREVIEW_START_TIMEOUT_MS: ${VIDEOAI_PREVIEW_START_TIMEOUT_MS:-15000}
      VIDEOAI_PREVIEW_FFMPEG_CMD_KEY: ${VIDEOAI_PREVIEW_FFMPEG_CMD_KEY:-ffmpeg.cmd_preview_h264}
      VIDEOAI_WORKER_URL: ${WORKER_URL:-http://worker:8090}
      VIDEOAI_DINO_CAMERA_HOSTS: ${VIDEOAI_DINO_CAMERA_HOSTS:-192.168.11.65}
      HIKVISION_NVR_BASE_URL: ${HIKVISION_NVR_BASE_URL:-}
      HIKVISION_NVR_USERNAME: ${HIKVISION_NVR_USERNAME:-}
      HIKVISION_NVR_PASSWORD: ${HIKVISION_NVR_PASSWORD:-}
      LIVE_RTSP_RELAY_MODE: ${LIVE_RTSP_RELAY_MODE:-}
      FFMPEG_BIN: ${FFMPEG_BIN:-ffmpeg}
      VIDEOAI_STORAGE_CAMERA_DIR: /data/cameras
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,backend,backend-media,worker,triton,zlm,postgres,videoai-backend-1,videoai-backend-media-1,videoai-worker-1,videoai-triton-1,videoai-zlm-1,videoai-postgres-1,host.docker.internal
      no_proxy: localhost,127.0.0.1,backend,backend-media,worker,triton,zlm,postgres,videoai-backend-1,videoai-backend-media-1,videoai-worker-1,videoai-triton-1,videoai-zlm-1,videoai-postgres-1,host.docker.internal
    ports:
      - "${MEDIA_BACKEND_BIND:-192.168.11.194:8082}:8081"
    volumes:
      # Java 服务启动时一次性把 backend-lite 的 cameras.json 导入 PG
      - ./storage/cameras:/data/cameras:ro
    depends_on:
      postgres:
        condition: service_healthy
      zlm:
        condition: service_started

  worker:
    profiles:
      - inference
    # worker 通过 NVML（pynvml）采集 GPU 指标并随心跳上报，资源监控页依赖该数据；
    # 容器无 GPU 访问权限时心跳会上报 gpus=[]，监控页将没有 GPU 数据
    gpus: all
    build:
      context: ./worker
      network: host
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8081}
      TRITON_HTTP_URL: ${TRITON_HTTP_URL:-http://192.168.11.194:8003}
      TRITON_GRPC_URL: ${TRITON_GRPC_URL:-192.168.11.194:8004}
      WORKER_NODE_NAME: ${WORKER_NODE_NAME:-videoai-worker}
      WORKER_NODE_IP: ${WORKER_NODE_IP:-192.168.11.194}
      SCRFD_MODEL_NAME: scrfd_10g
      FACE_DETECTOR: ${FACE_DETECTOR:-retinaface}
      RETINAFACE_MODEL_NAME: ${RETINAFACE_MODEL_NAME:-retinaface_mobilenet}
      ARCFACE_MODEL_NAME: ${ARCFACE_MODEL_NAME:-arcface_finetune}
      ARCFACE_INPUT_NAME: ${ARCFACE_INPUT_NAME:-auto}
      ARCFACE_OUTPUT_NAME: ${ARCFACE_OUTPUT_NAME:-auto}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.55}
      FACE_EVENT_COOLDOWN_SECONDS: ${FACE_EVENT_COOLDOWN_SECONDS:-10}
      FRAME_SAMPLE_FPS: ${FRAME_SAMPLE_FPS:-0}
      VIDEOAI_STORAGE_ALGORITHM_DIR: /data/algorithms
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,backend,backend-media,worker,triton,zlm,postgres,videoai-backend-1,videoai-backend-media-1,videoai-worker-1,videoai-triton-1,videoai-zlm-1,videoai-postgres-1,host.docker.internal
      no_proxy: localhost,127.0.0.1,backend,backend-media,worker,triton,zlm,postgres,videoai-backend-1,videoai-backend-media-1,videoai-worker-1,videoai-triton-1,videoai-zlm-1,videoai-postgres-1,host.docker.internal
    depends_on:
      backend:
        condition: service_started
      triton:
        condition: service_started
      zlm:
        condition: service_started
    volumes:
      - ./storage/algorithms:/data/algorithms
      # 宿主机根目录只读挂载：monitor.py 用 psutil 采集宿主机磁盘使用率（容器内 / 是 overlay）
      - /:/host:ro
    ports:
      - "192.168.11.194:18099:8090"
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
      network: host
    environment:
      VIDEOAI_BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8081}
      VIDEOAI_MEDIA_BACKEND_URL: http://backend-media:8081
      PERSON_API_BASE_URL: ${PERSON_API_BASE_URL:-http://192.168.11.192:18890}
      RETRIEVE_API_BASE_URL: ${RETRIEVE_API_BASE_URL:-http://192.168.11.194:15011}
      RETRIEVE_API_TIMEOUT_SECONDS: ${RETRIEVE_API_TIMEOUT_SECONDS:-120}
      VIDEO_ANALYSIS_API_BASE_URL: ${VIDEO_ANALYSIS_API_BASE_URL:-http://192.168.11.192:8775}
      VIDEO_ANALYSIS_TIMEOUT_SECONDS: ${VIDEO_ANALYSIS_TIMEOUT_SECONDS:-600}
      VIDEOAI_ZLM_HTTP_URL: ${ZLM_HTTP_URL:-http://zlm}
      VIDEOAI_ZLM_PUBLIC_HTTP_URL: ${ZLM_PUBLIC_HTTP_URL:-http://localhost:8080}
      VIDEOAI_ZLM_SECRET: ${ZLM_SECRET:-035c73f7-bb6b-4889-a715-d9eb2d1925cc}
      VIDEOAI_ZLM_RTMP_PUSH_BASE: ${ZLM_RTMP_PUSH_BASE:-rtmp://localhost/live}
      VIDEOAI_MCP_HOST: 0.0.0.0
      VIDEOAI_MCP_PORT: 8097
      VIDEOAI_MCP_TRANSPORT: streamable-http
      VIDEOAI_MCP_PLAYBACK_TTL_SECONDS: ${VIDEOAI_MCP_PLAYBACK_TTL_SECONDS:-1800}
      VIDEOAI_MCP_RECORDING_FALLBACK_FILE: ${VIDEOAI_MCP_RECORDING_FALLBACK_FILE:-}
      HIKVISION_NVR_BASE_URL: ${HIKVISION_NVR_BASE_URL:-}
      HIKVISION_NVR_USERNAME: ${HIKVISION_NVR_USERNAME:-}
      HIKVISION_NVR_PASSWORD: ${HIKVISION_NVR_PASSWORD:-}
      HCNETSDK_HOST: ${HCNETSDK_HOST:-192.168.11.198}
      HCNETSDK_PORT: ${HCNETSDK_PORT:-8000}
      HCNETSDK_USERNAME: ${HCNETSDK_USERNAME:-admin}
      HCNETSDK_PASSWORD: ${HCNETSDK_PASSWORD:-cisdi123}
      HCNETSDK_CHANNEL: ${HCNETSDK_CHANNEL:-1}
      HCNETSDK_DOWNLOAD_NVR_HOSTS: ${HCNETSDK_DOWNLOAD_NVR_HOSTS:-10.10.7.252,10.10.7.253}
      HCNETSDK_DOWNLOAD_PORT: ${HCNETSDK_DOWNLOAD_PORT:-8000}
      HCNETSDK_DOWNLOAD_USERNAME: ${HCNETSDK_DOWNLOAD_USERNAME:-admin}
      HCNETSDK_DOWNLOAD_PASSWORD: ${HCNETSDK_DOWNLOAD_PASSWORD:-}
      HCNETSDK_DOWNLOAD_CHANNEL: ${HCNETSDK_DOWNLOAD_CHANNEL:-1}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-192.168.11.194}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-Klg4dM9F3H}
      MINIO_BUCKET: ${MINIO_BUCKET:-public}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,backend,backend-media,worker,triton,zlm,postgres,videoai-backend-1,videoai-backend-media-1,videoai-worker-1,videoai-triton-1,videoai-zlm-1,videoai-postgres-1,host.docker.internal
      no_proxy: localhost,127.0.0.1,backend,backend-media,worker,triton,zlm,postgres,videoai-backend-1,videoai-backend-media-1,videoai-worker-1,videoai-triton-1,videoai-zlm-1,videoai-postgres-1,host.docker.internal
    depends_on:
      backend:
        condition: service_started
      zlm:
        condition: service_started
    volumes:
      - ${VIDEOAI_MCP_RECORDING_FALLBACK_FILE_HOST:-/dev/null}:/data/demo-recording-601.ps:ro
    ports:
      - "192.168.11.194:8097:8097"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      network: host
      # API 请求走同源 nginx 反代，不注入 VITE_*_BASE_URL（浏览器直连后端端口在现网可能被限速）
    restart: unless-stopped
    ports:
      - "192.168.11.194:5173:5173"
    depends_on:
      backend:
        condition: service_started

  frontend-search:
    profiles:
      - modular
    build:
      context: ./frontend
      network: host
      args:
        BUILD_MODE: search
    restart: unless-stopped
    ports:
      - "192.168.11.194:5174:5173"
    depends_on:
      backend:
        condition: service_started

  frontend-media:
    profiles:
      - modular
    build:
      context: ./frontend
      network: host
      args:
        BUILD_MODE: media
    restart: unless-stopped
    ports:
      - "192.168.11.194:5175:5173"
    depends_on:
      backend:
        condition: service_started

  frontend-control:
    profiles:
      - modular
    build:
      context: ./frontend
      network: host
      args:
        BUILD_MODE: control
    restart: unless-stopped
    ports:
      - "192.168.11.194:5176:5173"
    depends_on:
      backend:
        condition: service_started

  frontend-review:
    profiles:
      - modular
    build:
      context: ./frontend
      network: host
      args:
        BUILD_MODE: review
    restart: unless-stopped
    ports:
      - "192.168.11.194:5177:5173"
    depends_on:
      backend:
        condition: service_started

  sxin-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/sxin-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "192.168.11.194:10997:80"
    restart: unless-stopped

volumes:
  postgres-data:
