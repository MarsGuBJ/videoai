map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "frame-ancestors 'self' http://192.168.11.194:5173" always;

    location / {
        proxy_pass http://192.168.11.192:9997;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.11.192:9997;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect http://192.168.11.192:9997/ http://192.168.11.194:10997/;
        proxy_cookie_domain 192.168.11.192 192.168.11.194;
        proxy_cookie_domain .192.168.11.192 192.168.11.194;
        proxy_cookie_domain localhost 192.168.11.194;
        proxy_cookie_flags ~ nosecure samesite=lax;
    }
}
